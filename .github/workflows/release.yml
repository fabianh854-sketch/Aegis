# Baut und testet Aegis für Windows, sobald ein Tag wie v0.1.0 gepusht wird.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Dieser Workflow VERÖFFENTLICHT NICHTS. Release-Dateien werden lokal gebaut und lokal signiert
# (scripts\release.ps1); sonst könnte ein manipulierter Workflow unsignierte Dateien neben die echten legen.
# Hier läuft nur eine unabhängige Gegenprobe: Tag zur Version passend, Tests grün, Release-Build baut.
#
# Der Tag muss zur Version in Cargo.toml ([workspace.package] version) passen, sonst bricht der Lauf ab.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.ref_name }}
      # C-Laufzeit statisch einbinden, damit die .exe ohne Visual-C++-Redistributable startet.
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tag mit Cargo-Version vergleichen
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'aegis-app').version
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG passt nicht zur Version $version in Cargo.toml"
            exit 1
          }

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release-Build
        run: cargo build --release --locked -p aegis-app -p aegis-updater
