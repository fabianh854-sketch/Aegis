# Baut Aegis für Windows und veröffentlicht ein GitHub-Release, sobald ein Tag wie v0.1.0 gepusht wird.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Der Tag muss zur Version in Cargo.toml ([workspace.package] version) passen, sonst bricht der Lauf ab.
# Tags mit Bindestrich (z. B. v0.2.0-beta.1) werden als Vorabversion veröffentlicht.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write # Release anlegen und Dateien hochladen
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.ref_name }}
      # C-Laufzeit statisch einbinden, damit die .exe ohne Visual-C++-Redistributable startet.
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tag mit Cargo-Version vergleichen
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'aegis-app').version
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG passt nicht zur Version $version in Cargo.toml"
            exit 1
          }

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release-Build
        run: cargo build --release --locked -p aegis-app

      - name: Paket schnüren
        run: |
          $name = "aegis-$env:TAG-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage, (Join-Path $stage 'licenses') | Out-Null
          Copy-Item target/release/aegis-app.exe (Join-Path $stage 'aegis.exe')
          Copy-Item README.md, LICENSE -Destination $stage
          # Die eingebetteten Schriften stehen unter der SIL OFL 1.1; die Lizenz muss mitgeliefert werden.
          Copy-Item crates/aegis-app/assets/fonts/OFL-*.txt -Destination (Join-Path $stage 'licenses')

          $zip = "$name.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ASSET=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            'release', 'create', $env:TAG, $env:ASSET, "$env:ASSET.sha256",
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', "Aegis $env:TAG",
            '--generate-notes',
            '--verify-tag'
          )
          if ($env:TAG.Contains('-')) { $ghArgs += '--prerelease' }
          gh @ghArgs
