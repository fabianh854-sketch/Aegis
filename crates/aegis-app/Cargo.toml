[package]
name = "aegis-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-update = { path = "../aegis-update" }
eframe = "0.29"
arboard = { version = "3.6", default-features = false }
zeroize = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3.0"
